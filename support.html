<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doku Support | Poliglot</title>
  <style>
:root {
  --bg: #f7f7f5;
  --card: #ffffff;
  --text: #161616;
  --muted: #626262;
  --border: #deded9;
  --accent: #2b59c3;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
header {
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,.92);
}
nav {
  max-width: 900px;
  margin: auto;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { font-weight: 700; text-decoration: none; color: var(--text); }
.links a { margin-left: 18px; color: var(--text); text-decoration: none; }
main {
  max-width: 900px;
  margin: 64px auto;
  padding: 0 24px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 36px;
}
h1 { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.1; margin-top: 0; }
h2 { margin-top: 32px; }
p, li { color: var(--muted); }
a { color: var(--accent); }
footer {
  max-width: 900px;
  margin: 50px auto 20px;
  padding: 0 24px;
  color: var(--muted);
  font-size: .9rem;
}
</style>
</head>
<body>

<header>
  <nav>
    <a class="brand" href="/">Poliglot</a>
    <div class="links">
      <a href="/privacy.html">Privacy</a>
      <a href="/support.html">Support</a>
    </div>
  </nav>
</header>

<main>
  <section class="card">
    <h1>Doku Support</h1>
    <p>For help, bug reports, or privacy questions, email <a href="mailto:support@poliglotnews.com">support@poliglotnews.com</a>.</p>
    <p>Please include your device model, iOS version, Doku app version, and a brief description of the issue.</p>
  </section>
</main>

<footer>© 2026 Poliglot News LLC</footer>

</body>
</html>
